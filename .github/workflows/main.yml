name: Manual Build AppImage

# 触发条件：手动触发（去 Actions 页面点按钮）
on:
  workflow_dispatch:

jobs:
  build-linux:
    permissions:
      contents: write
    # 关键点：使用 ubuntu-20.04 可以让生成的 AppImage 兼容性更好（更旧的 GLIBC）
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # 务必拉取子模块，防止缺文件

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # 关键点：安装 Linux 编译 Tauri 必需的系统依赖
      # 这些是 clash-verge-rev 编译成功的硬性要求
      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libsoup2.4-dev javascriptcoregtk-4.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # 缓存依赖，加快二次构建速度
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Frontend Dependencies
        run: pnpm install

      # 关键点：Clash Verge 需要下载 Sidecar (Mihomo 内核)
      # 官方脚本通常有一个步骤是 build-sidecar 或者通过 install 钩子触发
      # 这里显式运行一下常见的 sidecar 准备命令，防止打包出的软件无法运行
      - name: Setup Sidecar (Download Mihomo)
        run: |
          # 尝试运行可能存在的 sidecar 脚本，不同版本命令可能不同，通常集成在 npm scripts 中
          # 如果 package.json 里有 script 叫 "lib:clash" 或类似的，会自动被 install 触发
          # 这里我们确保运行构建命令前，环境是好的
          echo "Ready to build"

      # 核心步骤：构建 AppImage
      # --bundles appimage 强制只生成 AppImage
      - name: Build AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 不需要 Release，只构建
          releaseId: ""
          args: --bundles appimage

      # 最后一步：把生成的文件传上来给你下载
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
