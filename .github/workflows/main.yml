name: Build Clash Verge Rev

# 触发条件：手动点击按钮触发 (workflow_dispatch)
on: 
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04 # 使用 Ubuntu 22.04 环境，自带很多工具

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装系统依赖 (这里有 sudo，完美解决你缺库的问题！)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # 3. 安装 Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. 安装 Node.js 和 pnpm
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3 # <--- 升级 action 版本
        with:
          version: 9 # <--- 关键修改：升级 pnpm 版本到 9

      # 5. 安装前端依赖
      - name: Install Frontend Dependencies
        run: pnpm install

      # 6. 执行构建 (Tauri Build)
      - name: Build App
        run: pnpm tauri build
        env:
          # 有些 tauri 编译需要这个环境变量
          NO_STRIP: true 

      # 7. 上传编译结果 (Artifact)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-linux-build
          # 这里的路径取决于编译输出的位置，通常在这里
          path: src-tauri/target/release/bundle/appimage/*.AppImage
